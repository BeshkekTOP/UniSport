<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniSport - Расписание матчей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">Календарь предстоящих матчей</h1>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Дата и время</th>
                    <th>Матч</th>
                    <th>Место</th>
                    <th>Статус</th>
                </tr>
                </thead>
                <tbody>
                {% for match in matches %}
                    <tr>
                        <td>{{ match.date_time|date:"d.m.Y H:i" }}</td>
                        <td>{{ match.home_team.name }} - {{ match.away_team.name }}</td>
                        <td>{{ match.location }}</td>
                        <td>{{ match.get_status_display }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4" class="text-center py-4">Предстоящих матчей нет.</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
