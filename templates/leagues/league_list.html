<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniSport - Активные лиги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">Активные лиги UniSport</h1>
    <div class="row g-3">
        {% for league in leagues %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ league.get_sport_display }}</h5>
                        <p class="card-text mb-1"><strong>Сезон:</strong> {{ league.season }}</p>
                        <p class="card-text mb-1"><strong>Статус:</strong> {{ league.get_status_display }}</p>
                        <p class="card-text"><strong>Менеджер:</strong> {{ league.manager.username }}</p>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info">Сейчас нет активных лиг.</div>
            </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
